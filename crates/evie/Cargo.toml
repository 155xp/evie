[package]
name = "evie"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts"] }
egui = "0.37.0"
egui-wgpu = "0.37.0"
env_logger = "0.11.11"
evie-core = { version = "0.1.0", path = "../evie-core" }
half = "2.7.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
log = "0.4.34"
parking_lot = "0.13.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12.0"
ureq = "3.5.0"
